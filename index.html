      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 26px;
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game {
      background-color: #1c1c1c;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px #00000088;
      transition: transform 0.2s;
    }

    .game:hover {
      transform: scale(1.02);
    }

    .game img.main {
      width: 70%;
      border-radius: 10px;
    }

    .game img.logo {
      margin-top: 22px;
      width: 190px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 20px;
      }

      .game img.logo {
        width: 190px;
      }
    }
  </style>
</head>
