<head>

  <title>🔥 Play Free Fire TV Games – Fun for All Devices!</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 28px;
      margin-top: 20px;
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game-box {
      background-color: #1d1d1d;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
      transition: transform 0.3s ease;
    }

    .game-box:hover {
      transform: scale(1.03);
    }

    .game-box img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .amazon-btn {
      margin-top: 10px;
      display: inline-block;
    }

    .amazon-btn img {
      width: 200px;
      height: auto;
    }

    @media (min-width: 900px) {
      .games-container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 899px) {
      .games-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .games-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
