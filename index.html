      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 40px;
      justify-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .game-box {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s;
      width: 200px;
    }

    .game-box:hover {
      transform: scale(1.03);
    }

    .game-box img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .game-box p {
      margin: 10px 0 5px;
      font-weight: bold;
    }

    .amazon-logo {
      margin-top: 10px;
      width: 120px;
      height: auto;
    }

    a {
      text-decoration: none;
      color: white;
    }

    @media (max-width: 600px) {
      .game-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
