<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fire TV Games</title>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      width: 100%;
      max-width: 1100px;
      justify-items: center;
    }

    .game-box {
      width: 280px;
      background-color: #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }

    .game-box:hover {
      transform: scale(1.05);
    }

    .game-box img {
      width: 100%;
      display: block;
    }

    .game-box p {
      padding: 12px;
      margin: 0;
    }

    a {
      color: white;
      text-decoration: none;
    }

    /* 👇 Media Query: الهواتف الذكية */
    @media screen and (max-width: 768px) {
      .game-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 👇 Media Query: الشاشات الصغيرة بزاف */
    @media screen and (max-width: 480px) {
      .game-grid {
        grid-template-columns: repeat(1, 1fr);
      }

      .game-box {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h1>🔥 Fire TV Games 🔥</h1>

  <div class="game-grid">
    <div class="game-box">
      <a href="https://www.amazon.com/Fidget-Fight-Pop-It-3D/dp/B0DYWKSGG9">
        <img src="001.png" alt="Game 1" />
        <p>Game 1</p>
      </a>
    </div>
    <div class="game-box">
      <a href="https://www.amazon.com/Fidget-Fight-Pop-It-3D/dp/B0DYWKSGG9">
        <img src="002.png" alt="Game 2" />
        <p>Game 2</p>
      </a>
    </div>
    <div class="game-box">
      <a href="https://www.amazon.com/Fidget-Fight-Pop-It-3D/dp/B0DYWKSGG9">
        <img src="003.png" alt="Game 3" />
        <p>Game 3</p>
      </a>
    </div>
    <div class="game-box">
      <a href="https://www.amazon.com/Fidget-Fight-Pop-It-3D/dp/B0DYWKSGG9">
        <img src="004.png" alt="Game 4" />
        <p>Game 4</p>
      </a>
    </div>
    <div class="game-box">
      <a href="https://www.amazon.com/Fidget-Fight-Pop-It-3D/dp/B0DYWKSGG9">
        <img src="005.png" alt="Game 5" />
        <p>Game 5</p>
      </a>
    </div>
    <div class="game-box">
      <a href="https://www.amazon.com/Fidget-Fight-Pop-It-3D/dp/B0DYWKSGG9">
        <img src="006.png" alt="Game 6" />
        <p>Game 6</p>
      </a>
    </div>
  </div>

</body>
</html>
